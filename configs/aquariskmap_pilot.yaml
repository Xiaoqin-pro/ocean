experiment:
  name: aquariskmap_suim_pilot_v1
  output_dir: outputs/aquariskmap_suim_pilot_v1
  seed: 20260725
protocol:
  parent_benchmark_commit: 8d24fdf
  official_suim_test_locked: true
  official_suim_test_evaluated: false
  risk_head_split: data/suim_processed/splits/aquariskmap_risk_head_v1
  validation_split: data/suim_processed/splits/v2_scene_grouped_deduplicated/val.csv
  calibration_split: data/suim_processed/splits/v2_scene_grouped_deduplicated/calibration.csv
features:
  grid_size: 96
  input_channels: 14
  class_indexed_logits_allowed: false
  blocks:
    - normalized_rgb
    - top4_sorted_probabilities
    - top3_probability_gaps
    - normalized_entropy
    - class_count_normalized_logsumexp
    - local_label_disagreement_3x3
    - predicted_label_boundary
model:
  max_trainable_parameters: 200000
  stem_channels: 64
  dilations: [1, 2, 3]
training:
  epochs: 20
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  amp: true
  base_scenes_per_batch: 4
  paired_views_per_scene: 2
  checkpoint_selection: final_epoch
loss:
  error_weight: 1.0
  ranking_weight: 0.25
  trajectory_weight: 0.25
  boundary_radius: 3
  boundary_weight: 2.0
  ranking_pairs_per_batch: 2048
  trajectory_margin: 0.10
certification:
  selector: global_crc_only
  alpha: 0.10
  coverage_grid: [0.01, 1.0, 0.01]
  monotone_envelope: true
