experiment:
  name: uiis_scdi_replication
  branch: experiment/sgre-seg
  seed: 20260811
  output_dir: outputs/uiis_scdi_replication

data:
  train_csv: data/uiis_processed/splits/uiis_alpha010_confirmation/train.csv
  confirmation_csv: data/uiis_processed/splits/uiis_alpha010_confirmation/confirmation.csv
  image_size: 384
  degradation_registry: configs/degradation_pilot.yaml
  train_images: 2371
  confirmation_images: 511

model:
  pretrained_model: nvidia/mit-b0
  source_checkpoint: outputs/segformer_b0_uiis_alpha010_confirmation/checkpoints/last.pt
  hidden_sizes: [32, 64, 160, 256]
  num_classes: 8
  rectifier_reduction: 4

training:
  epochs: 8
  batch_size: 4
  backbone_learning_rate: 0.00001
  expert_learning_rate: 0.0001
  weight_decay: 0.01
  amp: true
  tangent_weight: 0.02
  clean_identity_weight: 0.02
  tangent_minimum_pixels: 4
  checkpoint_selection: final_epoch

evaluation:
  conditions: [clean, color_s3, turbidity_s3, lowlight_s3, blur_s3]
  confirmation_locked: true
  official_suim_test_locked: true
