experiment:
  name: sadr_prob_order_v2
  branch: experiment/sgre-seg
  seed: 20260811
  output_dir: outputs/sadr_prob_order_v2

data:
  train_csv: data/uiis_processed/splits/uiis_alpha010_confirmation/train.csv
  confirmation_csv: data/uiis_processed/splits/uiis_alpha010_confirmation/confirmation.csv
  uiis_config: configs/uiis_scdi_replication.yaml
  degradation_registry: configs/degradation_pilot.yaml
  image_size: 256
  evaluation_image_size: 384

evaluation:
  conditions: [clean, color_s1, color_s2, color_s3, turbidity_s1, turbidity_s2, turbidity_s3, lowlight_s1, lowlight_s2, lowlight_s3, blur_s1, blur_s2, blur_s3]

training:
  epochs: 4
  batch_size: 8
  learning_rate: 0.0001
  weight_decay: 0.0001
  amp: true
  segmentation_weight: 1.0
  reconstruction_weight: 0.10
  identity_weight: 0.10
  distillation_weight: 0.05
  residual_weight: 0.01
  composition_mode: probability_order
  composition_weight: 0.05
  composition_start_epoch: 2
  composition_every: 8
  composition_microbatch: 2
